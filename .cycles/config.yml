project:
  name: "dsh-anic"
  tech_stack: ["typescript"]
  framework: "claude"

macro_cycle:
  enabled_phases: [plan, design, build, test, deploy, maintain]
  autonomy_level: L4
  # cycle-77：band-detector 每次调用都提示「未设预算，用默认 100」。默认值本身正确
  # （全仓平均复杂度 18.1 / 预算 100），但把默认值显式写入配置才消除提示噪声——
  # 长期噪声会让「真的超预算」淹没在熟悉感里（告警疲劳）。
  complexity_budget: 100

build:
  build_cmd: "node scripts/build-client.mjs"
  # D-1401（cycle-14）：四个命令原指向 ../node_modules/...（cycle-1 时代的父级布局
  # 假设，TD-A1 过渡态老路径）——vitest/typescript 实际在本仓 node_modules/，
  # 陈旧路径导致 E3/E8 自举审计 MODULE_NOT_FOUND。统一改走本仓 wrapper 脚本。
  typecheck_cmd: "node scripts/typecheck.mjs"
  lint_cmd: "node scripts/validate-dsh.mjs"
  test_cmd: "node scripts/run-tests.mjs"
  # cycle-99b：全量测试面 3543+ 用例，实测 74-93s；默认预算 120s 在并行预热+冷
  # 缓存场景贴线（本轮实测 120007ms 触顶）。收敛到 240s（对实测上界 ~3×）。
  test_timeout_ms: 240000
  coverage_cmd: "node node_modules/vitest/vitest.mjs run --coverage"
  e2e_cmd: "node scripts/offline-smoke.mjs"
  hygiene_cmd: "node scripts/validate-dsh.mjs"

layers:
  - name: "Host"
    test_pattern: "tests/unit/**/*.test.ts"
    coverage_target: 80
  - name: "Client"
    test_pattern: "tests/unit/**/*.test.ts"
    coverage_target: 80
  - name: "Contract"
    test_pattern: "tests/contract/**/*.test.ts"
    coverage_target: 100

evaluation:
  E1:
    name: "意图对齐"
    checklist_ref: "docs/anic/11-插件功能设计-配置-日志-白盒-响应式.md"
  E2:
    name: "规格符合"
    checklist_ref: "docs/anic/02-需求分析.md"
  E3:
    name: "测试覆盖"
    checklist_ref: ""
  E4:
    name: "代码质量"
    checklist_ref: ""
  E5:
    name: "性能基线"
    checklist_ref: ""
  E6:
    name: "安全检查"
    checklist_ref: ""
  E7:
    name: "文档同步"
    checklist_ref: "README.md"
  E8:
    name: "回归完整性"
    checklist_ref: ""

journeys:
  J1:
    name: "插件安装与自举"
    forward: "安装 → 技能内联 → 自举 init → 可视化"
    reverse: "无 .cycles、无技能、kill-switch"
    test_files: ["tests/unit/native.test.ts"]
  J2:
    name: "面板观测旅程"
    forward: "打开 ANIC 标签页 → 图区/实时调用/cycle 时间线/流程状态机/账本/HITL/预算分区渲染 → 节点详情（含 why 层）→ 手动刷新"
    reverse: "路由缺失/404/无 fetch → 嵌入快照降级；分区关闭形态如实呈现；隐藏标签页暂停轮询"
    test_files: ["tests/unit/usePanelFetch.test.ts", "tests/contract/clientRenderContract.test.ts"]
  J3:
    name: "跨项目技能调用"
    forward: "anic_skill workspace=目标项目 → 脚本在目标项目执行 → flow-tracker 落目标项目"
    reverse: "args 误带项目目录 → 网关重定向（workspaceRedirected）或脚本数量守卫拒绝"
    test_files: ["tests/unit/skillToolNative.test.ts", "tests/unit/flowTrackerIntegration.test.ts"]
  J4:
    name: "技能生命周期（安装→校验→修复）"
    forward: "anic_install 装锚 → integrity 校验 → 内容演进 → anic_skill_repair 差异重装"
    reverse: "副本篡改/版本漂移 → integrity 点名 mismatch → repair 只重装差异文件"
    test_files: ["tests/unit/skillLifecycleRoute.test.ts", "tests/unit/skillIntegrity.test.ts"]

gates:
  G0:
    fact_base_verify_count: 5
  G1:
    task_completion_required: true
  G2:
    coverage_threshold:
      lines: 80
      branches: 65
    # cycle-39 T-3903：journey_coverage 现在有真实门禁实现（gate-check.mjs
    # checkJourneyCoverage：journeys 声明的 test_files 必须存在且非空）。
    # chaos_coverage 已删除——journeys 协议无 chaos 旅程定义，装饰性声明
    # 与「没有证据 ≠ 通过」纪律冲突（诚实优先）。
    journey_coverage: true
  G3:
    build_commands: ["node scripts/build-client.mjs"]

human_gates:
  intent_accept:
    role: "product_owner"
  spec_approve:
    role: "product_owner"
    consult: "tech_lead"
  plan_approve:
    role: "engineer"
  pr_merge:
    role: "code_owner"
  release_authorize:
    role: "release_manager"

control_bands:
  enabled: false
  metrics: []
  baseline_window_days: 30
  tiers:
    sigma_1: "log"
    sigma_2: "diagnose"
    sigma_3: "act_via_pr"

framework_alignment:
  name: "claude"
  rules: []

performance_baselines: []

vision_benchmarking:
  enabled: false
  dimensions: []
